name: Daily Email Digest

on:
  schedule:
    # Run at 11:00 UTC (08:00 Argentina time / GMT-3)
    # This is after the scraper runs at 03:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Test email (leave empty for all subscribers)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no actual emails sent)'
        required: false
        type: boolean
        default: false
      digest_type:
        description: 'Type of digest to send'
        required: false
        type: choice
        options:
          - daily
          - ending_today
        default: daily

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send daily digest
        if: ${{ github.event.inputs.digest_type != 'ending_today' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.test_email }}" ]; then
            ARGS="$ARGS --test ${{ github.event.inputs.test_email }}"
          fi
          python scripts/send_daily_digest.py $ARGS
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          VERCEL_KV_REST_API_URL: ${{ secrets.VERCEL_KV_REST_API_URL }}
          VERCEL_KV_REST_API_TOKEN: ${{ secrets.VERCEL_KV_REST_API_TOKEN }}

      - name: Send ending today alerts
        if: ${{ github.event.inputs.digest_type == 'ending_today' }}
        run: |
          ARGS="--ending-today"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.test_email }}" ]; then
            ARGS="$ARGS --test ${{ github.event.inputs.test_email }}"
          fi
          python scripts/send_daily_digest.py $ARGS
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERCEL_KV_REST_API_URL: ${{ secrets.VERCEL_KV_REST_API_URL }}
          VERCEL_KV_REST_API_TOKEN: ${{ secrets.VERCEL_KV_REST_API_TOKEN }}

      - name: Summary
        run: |
          echo "## Email Digest Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event.inputs.digest_type || 'daily' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.test_email }}" ]; then
            echo "- **Test Email**: ${{ github.event.inputs.test_email }}" >> $GITHUB_STEP_SUMMARY
          fi

  # Optional: Send ending today alerts at a different time
  ending-today-alerts:
    runs-on: ubuntu-latest
    # Run at 14:00 UTC (11:00 Argentina time)
    # Only on scheduled runs, not manual triggers
    if: ${{ github.event_name == 'schedule' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send ending today alerts
        run: python scripts/send_daily_digest.py --ending-today
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VERCEL_KV_REST_API_URL: ${{ secrets.VERCEL_KV_REST_API_URL }}
          VERCEL_KV_REST_API_TOKEN: ${{ secrets.VERCEL_KV_REST_API_TOKEN }}
