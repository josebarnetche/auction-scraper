<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#030303"/>

  <!-- Background radar pattern -->
  <g transform="translate(600, 315)" opacity="0.15">
    <circle cx="0" cy="0" r="280" fill="none" stroke="#eab308" stroke-width="1"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#eab308" stroke-width="1"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#eab308" stroke-width="1"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#eab308" stroke-width="1"/>
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#eab308" stroke-width="1"/>
    <line x1="0" y1="-300" x2="0" y2="300" stroke="#eab308" stroke-width="1"/>
  </g>

  <!-- Logo -->
  <g transform="translate(600, 200)">
    <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#eab308" stroke-width="5" transform="rotate(45)"/>
    <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#a16207" stroke-width="3" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="12" fill="#eab308"/>
  </g>

  <!-- Text -->
  <text x="600" y="340" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="600">
    Subasto<tspan fill="#eab308">.com.ar</tspan>
  </text>

  <text x="600" y="400" text-anchor="middle" fill="#a3a3a3" font-family="sans-serif" font-size="28">
    Subastas Judiciales y Privadas en Argentina
  </text>

  <!-- Stats bar -->
  <g transform="translate(600, 500)">
    <text x="-300" y="0" text-anchor="middle" fill="#eab308" font-family="sans-serif" font-size="36" font-weight="bold">800+</text>
    <text x="-300" y="30" text-anchor="middle" fill="#737373" font-family="sans-serif" font-size="16">SUBASTAS</text>

    <text x="0" y="0" text-anchor="middle" fill="#eab308" font-family="sans-serif" font-size="36" font-weight="bold">14</text>
    <text x="0" y="30" text-anchor="middle" fill="#737373" font-family="sans-serif" font-size="16">FUENTES</text>

    <text x="300" y="0" text-anchor="middle" fill="#eab308" font-family="sans-serif" font-size="36" font-weight="bold">4</text>
    <text x="300" y="30" text-anchor="middle" fill="#737373" font-family="sans-serif" font-size="16">JUDICIALES</text>
  </g>
</svg>
