<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#030303"/>
  <g transform="translate(256, 256)">
    <!-- Outer radar circles -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.5"/>
    <!-- Crosshairs -->
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#854d0e" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#854d0e" stroke-width="2" opacity="0.3"/>
    <!-- Outer diamond -->
    <rect x="-85" y="-85" width="170" height="170" fill="none" stroke="#eab308" stroke-width="8" transform="rotate(45)"/>
    <!-- Inner diamond -->
    <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#a16207" stroke-width="5" transform="rotate(45)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="20" fill="#eab308"/>
    <!-- Glow ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#854d0e" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
