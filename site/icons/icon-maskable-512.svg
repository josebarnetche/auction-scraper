<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon with safe zone (icon content in center 80%) -->
  <rect width="512" height="512" fill="#030303"/>
  <g transform="translate(256, 256)">
    <!-- Scaled down to fit in safe zone (80% of original) -->
    <!-- Outer radar circles -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.5"/>
    <!-- Crosshairs -->
    <line x1="-176" y1="0" x2="176" y2="0" stroke="#854d0e" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-176" x2="0" y2="176" stroke="#854d0e" stroke-width="2" opacity="0.3"/>
    <!-- Outer diamond -->
    <rect x="-68" y="-68" width="136" height="136" fill="none" stroke="#eab308" stroke-width="6" transform="rotate(45)"/>
    <!-- Inner diamond -->
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#a16207" stroke-width="4" transform="rotate(45)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="16" fill="#eab308"/>
    <!-- Glow ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#854d0e" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
